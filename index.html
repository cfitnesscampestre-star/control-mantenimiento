<meta name="mobile-web-app-capable" content="yes">

<!-- Al subir cambios, sube el número ?v= (y VERSION en sw.js) para que los celulares no usen archivos viejos -->
<link rel="stylesheet" href="css/main.css?v=19">
<link rel="stylesheet" href="css/glassmorphism.css?v=19">
<link rel="stylesheet" href="css/mantenimiento.css?v=19">

</head>
<body>
<div id="app"></div>
<div id="modal" class="modal" hidden></div>
<div id="toast" class="toast" role="status" aria-live="polite"></div>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-database-compat.js"></script>

<script src="js/informes.js?v=19"></script>
<script>
/* Versión nueva: el service worker se instala solo; cuando toma el control y la app ya estaba abierta, se avisa con "Recargar".
   Se busca versión nueva al abrir, al volver a la app y cada 30 minutos. */
if('serviceWorker' in navigator){
  var cmHabiaSW = !!navigator.serviceWorker.controller;
  navigator.serviceWorker.addEventListener('controllerchange', function(){ if (cmHabiaSW && window.avisaVersion) window.avisaVersion(); cmHabiaSW = true; });
  window.addEventListener('load', function(){
    navigator.serviceWorker.register('sw.js').then(function(reg){
      var busca = function(){ reg.update().catch(function(){}); };
      document.addEventListener('visibilitychange', function(){ if (!document.hidden) busca(); });
      setInterval(busca, 30 * 60000);
    }).catch(function(){});
  });
}
</script>
</body>
